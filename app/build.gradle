plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fivegmag.dvbiclient'
    compileSdk 37

    defaultConfig {
        applicationId "com.fivegmag.dvbiclient"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        // Defaults shown in the settings until the user changes them: the demo laptop on the Wi-Fi.
        buildConfigField 'String', 'DEFAULT_SERVICE_LIST_URL',
            "\"${providers.gradleProperty('dvbiServiceListUrl').getOrElse('http://192.168.1.202:4000/service-list.xml')}\""
        buildConfigField 'String', 'DEFAULT_REGISTRY_URL',
            "\"${providers.gradleProperty('dvbiRegistryUrl').getOrElse('http://192.168.1.202:7000/query')}\""
    }

    buildFeatures {
        buildConfig = true
    }

    // The DVB-I client in its three roles. Each flavor's src/<flavor>/ holds its Role object, which
    // supplies the MBMS Client; the role's adapter module is a dependency of that flavor only.
    flavorDimensions = ['role']
    productFlavors {
        // Plain DVB-I, the default.
        dvbi {
            dimension = 'role'
            isDefault = true
        }
        // The DVB-I client acting as MBMS-Aware Application, ETSI TS 103 770 V1.2.1 clause 9.3.3.
        dvbiMbms {
            dimension = 'role'
            applicationIdSuffix = '.mbms'
        }
        // The DVB-I client acting as 5GMSd-Aware Application.
        dvbi5gms {
            dimension = 'role'
            applicationIdSuffix = '.fivegms'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':dvbi-core')
    dvbiMbmsImplementation project(':adapter-mbms')
    dvbi5gmsImplementation project(':adapter-5gms')

    implementation 'androidx.media3:media3-exoplayer:1.10.0'
    implementation 'androidx.media3:media3-exoplayer-dash:1.10.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.10.0'
    implementation 'androidx.media3:media3-ui:1.10.0'

    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    // Splash screen (compat for pre-Android 12), as in 5G-MAGflix
    implementation 'androidx.core:core-splashscreen:1.2.0'

    // Layout and home screen components of 5G-MAGflix
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    // Image loading (service logos)
    implementation 'io.coil-kt:coil:2.7.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
}

// Hosts this build lets the app reach over plain HTTP. ETSI TS 103 770 V1.2.1 clause 7.3 allows HTTP
// without TLS only towards an endpoint on the same private subnet, so cleartext is not opened to every
// host: the network security configuration lists these hosts and nothing else. Set them with
// -PdvbiCleartextHosts=<host>[,<host>...]; the default is the demo laptop's Wi-Fi address.
abstract class CleartextConfigTask extends DefaultTask {
    @Input
    abstract Property<String> getHosts()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void write() {
        def hosts = getHosts().get().split(',').collect { it.trim() }.findAll { it }
        hosts.each { h ->
            if (!(h ==~ /[A-Za-z0-9]([A-Za-z0-9.\-]*[A-Za-z0-9])?/)) {
                throw new GradleException("dvbiCleartextHosts: '${h}' is not a host name or IPv4 address")
            }
        }
        def xml = new StringBuilder()
        xml << '<?xml version="1.0" encoding="utf-8"?>\n'
        xml << '<!-- Generated by the generateCleartextConfig task from dvbiCleartextHosts. -->\n'
        xml << '<network-security-config>\n'
        xml << '    <base-config cleartextTrafficPermitted="false" />\n'
        if (!hosts.isEmpty()) {
            xml << '    <domain-config cleartextTrafficPermitted="true">\n'
            hosts.each { xml << "        <domain includeSubdomains=\"false\">${it}</domain>\n" }
            xml << '    </domain-config>\n'
        }
        xml << '</network-security-config>\n'
        def dir = getOutputDir().get().dir('xml').asFile
        dir.mkdirs()
        new File(dir, 'network_security_config.xml').text = xml.toString()
    }
}

// The repository's LICENSE as res/raw/license.txt, for the licence screen.
abstract class LicenseResourceTask extends DefaultTask {
    @InputFile
    abstract RegularFileProperty getLicense()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void write() {
        def dir = getOutputDir().get().dir('raw').asFile
        dir.mkdirs()
        new File(dir, 'license.txt').text = getLicense().get().asFile.text
    }
}

def licenseResource = tasks.register('generateLicenseResource', LicenseResourceTask) {
    license = rootProject.layout.projectDirectory.file('LICENSE')
}

def cleartextConfig = tasks.register('generateCleartextConfig', CleartextConfigTask) {
    hosts = providers.gradleProperty('dvbiCleartextHosts').orElse('192.168.1.202')
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.res.addGeneratedSourceDirectory(cleartextConfig, CleartextConfigTask::getOutputDir)
        variant.sources.res.addGeneratedSourceDirectory(licenseResource, LicenseResourceTask::getOutputDir)
    }
}
