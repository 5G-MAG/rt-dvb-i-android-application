name: test

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Android Gradle Plugin 9.2.0 runs on a JDK 17 or 21.
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      # The command-line tools and SDK packages of README.md, Install dependencies.
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      # Unit tests of dvbi-core, and the debug APK of each variant (dvbi, dvbiMbms, dvbi5gms).
      - run: ./gradlew test assembleDebug
